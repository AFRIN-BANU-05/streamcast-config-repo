spring.application.name=Clause-Service
server.port=8081

spring.datasource.url=jdbc:mysql://localhost:3306/clause_database
spring.datasource.username=root
spring.datasource.password=ctssql2026
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

eureka.instance.prefer-ip-address=true
info.app.name=Clause-Service
info.app.description=This service manages contract clauses and their details.
info.app.version=1.0.0

resilience4j.circuitbreaker.instances.contractService.registerHealthIndicator=true
resilience4j.circuitbreaker.instances.contractService.slidingWindowSize=10
resilience4j.circuitbreaker.instances.contractService.failureRateThreshold=50
resilience4j.circuitbreaker.instances.contractService.waitDurationInOpenState=10000
resilience4j.circuitbreaker.instances.contractService.minimumNumberOfCalls=5
resilience4j.circuitbreaker.instances.contractService.max-attempts=3
resilience4j.circuitbreaker.instances.contractService.wait-duration=2s
